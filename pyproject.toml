[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orr-station-usage"
version = "0.1.1"
description = "Read ORR estimates of station usage in Python: entries, exits and interchanges at every GB railway station since 1997."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dillon Rose", email = "dillonrose0@icloud.com" }]
keywords = ["orr", "station-usage", "footfall", "entries-and-exits", "passenger-numbers", "railway-stations", "railway", "uk-rail", "office-of-rail-and-road", "great-britain", "open-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["odfpy>=1.4", "openpyxl>=3.1", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
orr-station-usage = "orr_station_usage.cli:main"

[project.urls]
Homepage = "https://github.com/rosedillon/orr-station-usage"
Documentation = "https://github.com/rosedillon/orr-station-usage#readme"
Source = "https://github.com/rosedillon/orr-station-usage"
Issues = "https://github.com/rosedillon/orr-station-usage/issues"
Changelog = "https://github.com/rosedillon/orr-station-usage/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# PEP 8: code may run to 99 when agreed, but comments and docstrings
# still wrap at 72.
max-doc-length = 72

[tool.mypy]
strict = true

